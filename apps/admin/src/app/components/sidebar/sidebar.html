<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-name"><span>StarKies.</span><span class="brand-tagline">LA ESTRELLA ERES TÚ</span></div>
  </div>

  <a
    matButton="outlined"
    class="business-card"
    href="https://starkies.lat/"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Ir a mi tienda (abre en una pestaña nueva)"
  >
    <mat-icon class="business-external" fontSet="material-symbols-rounded" aria-hidden="true">open_in_new</mat-icon>
    <span class="business-copy">
      <strong>Ir a mi tienda</strong>
      <span>Ver catálogo público</span>
    </span>
  </a>

  <p class="nav-caption">Tu negocio</p>
  <nav class="sidebar-nav" aria-label="Navegación principal">
    @for (item of navItems; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active" class="nav-item">
        <mat-icon fontSet="material-symbols-rounded" class="nav-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label }}</span>
        @if (item.label === 'Pedidos') {
          <span class="nav-badge">1</span>
        }
      </a>
    }
  </nav>

  <div class="sidebar-bottom">
    <button
      type="button"
      matButton="text"
      class="settings-trigger"
      [matMenuTriggerFor]="settingsMenu"
      aria-label="Abrir configuración"
    >
      <mat-icon fontSet="material-symbols-rounded" aria-hidden="true">settings</mat-icon>
      <span>Configuración</span>
      <mat-icon class="settings-chevron" fontSet="material-symbols-rounded" aria-hidden="true">expand_less</mat-icon>
    </button>
    <mat-menu #settingsMenu="matMenu" xPosition="after" yPosition="above">
      <button mat-menu-item type="button" (click)="exportBackup()">
        <mat-icon fontSet="material-symbols-rounded" aria-hidden="true">download</mat-icon>
        <span>Descargar respaldo</span>
      </button>
      <button mat-menu-item type="button" [disabled]="loggingOut()" (click)="logout()">
        <mat-icon fontSet="material-symbols-rounded" aria-hidden="true">logout</mat-icon>
        <span>{{ loggingOut() ? 'Cerrando sesión…' : 'Cerrar sesión' }}</span>
      </button>
      @if (logoutMessage()) {
        <div class="settings-error" role="status" aria-live="polite">{{ logoutMessage() }}</div>
      }
    </mat-menu>
  </div>
</aside>

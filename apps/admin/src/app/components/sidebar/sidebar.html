<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-name"><span>StarKies.</span><span class="brand-tagline">LA ESTRELLA ERES TÚ</span></div>
  </div>

  <p class="nav-caption">Tu negocio</p>
  <nav class="sidebar-nav" aria-label="Navegación principal">
    @for (item of navItems; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active" class="nav-item">
        <mat-icon fontSet="material-symbols-rounded" class="nav-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label }}</span>
        @if (item.label === 'Pedidos') {
          @if (pendingOrderCount() > 0) { <span class="nav-badge" [attr.aria-label]="pendingOrderCount() + ' pedidos pendientes'">{{ pendingOrderCount() }}</span> }
        }
      </a>
      @if (item.label === 'Catálogo') {
        <a routerLink="/catalogo/promociones" routerLinkActive="active" class="nav-subitem" aria-label="Administrar promociones del catálogo">
          <mat-icon fontSet="material-symbols-rounded" aria-hidden="true">local_offer</mat-icon>
          <span>Promociones</span>
        </a>
        <a matButton="filled" class="business-card nav-item" href="https://starkies.lat/" target="_blank" rel="noopener noreferrer" aria-label="Mi tienda (abre en una pestaña nueva)">
          <mat-icon class="business-external" fontSet="material-symbols-rounded" aria-hidden="true">shopping_cart</mat-icon>
          <span class="business-copy"><strong>Mi tienda</strong></span>
        </a>
      }
    }
  </nav>
</aside>

<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo-box">
      <span class="logo-text">STØOKIES</span>
      <span class="logo-subtext">Panel Admin</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    @for (item of navItems; track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="active"
      class="nav-item"
    >
      <svg [lucideIcon]="item.icon" class="nav-icon"></svg>
      <span class="nav-label">{{ item.label }}</span>
    </a>
    }
  </nav>

  <div class="sidebar-footer">
    <button (click)="exportBackup()" class="btn-backup">
      <svg [lucideIcon]="icons.Download" class="btn-icon"></svg>
      <span>Descargar Respaldo</span>
    </button>
  </div>
</aside>

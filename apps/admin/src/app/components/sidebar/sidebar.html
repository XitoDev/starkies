<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-mark" aria-hidden="true">★</div>
    <div class="brand-name"><span>Star</span><strong>Kies</strong><sup>®</sup></div>
  </div>

  <a
    matButton="outlined"
    class="business-card"
    href="https://starkies.lat/"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Ir a mi tienda (abre en una pestaña nueva)"
  >
    <span class="business-mark" aria-hidden="true">
      <mat-icon fontSet="material-symbols-rounded">storefront</mat-icon>
    </span>
    <span class="business-copy">
      <strong>Ir a mi tienda</strong>
      <span>Ver catálogo público</span>
    </span>
    <mat-icon class="business-external" fontSet="material-symbols-rounded" aria-hidden="true">open_in_new</mat-icon>
  </a>

  <p class="nav-caption">Tu negocio</p>
  <nav class="sidebar-nav" aria-label="Navegación principal">
    @for (item of navItems; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active" class="nav-item">
        <mat-icon fontSet="material-symbols-rounded" class="nav-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label }}</span>
        @if (item.label === 'Pedidos') {
          <span class="nav-badge">1</span>
        }
      </a>
    }
  </nav>

  <div class="sidebar-bottom">
    <button matButton="text" (click)="exportBackup()" class="btn-backup">
      <mat-icon fontSet="material-symbols-rounded" class="btn-icon" aria-hidden="true">download</mat-icon>
      <span>Descargar respaldo</span>
    </button>
    <div class="sidebar-profile">
      <div class="profile-mark">S</div>
      <div class="profile-copy">
        <strong>StarKies</strong>
        <button
          type="button"
          matButton="text"
          class="profile-logout"
          [disabled]="loggingOut()"
          (click)="logout()"
        >
          <mat-icon fontSet="material-symbols-rounded" aria-hidden="true">logout</mat-icon>
          {{ loggingOut() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
        </button>
        @if (logoutMessage()) {
          <span class="profile-logout-error" role="status" aria-live="polite">{{ logoutMessage() }}</span>
        }
      </div>
    </div>
  </div>
</aside>

name: Deploy Public Catalog to Vercel

on:
  push:
    branches:
      - main
    paths-ignore:
      - "public/images/**"
      - "public/images/image-map.json"
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview

permissions:
  contents: read

concurrency:
  group: vercel-catalog-${{ github.event_name == 'push' && 'production' || inputs.target_environment }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate Catalog, then deploy
    runs-on: ubuntu-latest
    env:
      TARGET_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || inputs.target_environment }}
    steps:
      - name: Guard production deployment
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            if [ "$SELECTED_REF" != "refs/heads/main" ]; then
              echo "::error::Production deployments can only run from main."
              exit 1
            fi
          fi

      - name: Check Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CATALOG_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_CATALOG_PROJECT_ID."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from committed lockfile
        run: npm ci

      - name: Build catalog with static prerendering
        run: npx ng build catalog --configuration production

      - name: Verify prerendered catalog HTML for search engines
        run: |
          HTML_FILE="$(find dist/catalog -type f -name index.html -print -quit)"
          if [ -z "$HTML_FILE" ]; then
            echo "::error::No prerendered index.html was produced."
            exit 1
          fi
          grep -qi 'rel="canonical"' "$HTML_FILE"
          grep -qi 'Elige tu caja' "$HTML_FILE"
          echo "Verified canonical metadata and catalog shell in $HTML_FILE"

      - name: Test catalog
        run: npx ng test catalog --watch=false

      - name: Type-check public order API
        run: npx tsc --ignoreConfig --noEmit --strict --target ES2022 --moduleResolution bundler --module ES2022 --esModuleInterop --skipLibCheck --types node api/catalog.ts api/catalog-data.ts api/orders.ts api/order-document.ts api/customer-lookup.ts

      - name: Smoke-test public API imports with native Node ESM
        run: |
          rm -rf /tmp/starkies-catalog-esm
          npx tsc --ignoreConfig --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --skipLibCheck --types node --rootDir . --outDir /tmp/starkies-catalog-esm api/catalog-data.ts api/orders.ts
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/starkies-catalog-esm/node_modules
          node --input-type=module -e "await import('/tmp/starkies-catalog-esm/api/catalog-data.js'); const m = await import('/tmp/starkies-catalog-esm/api/orders.js'); if (typeof m.default !== 'function') process.exit(1); console.log('Native Node ESM resolved catalog and order API dependencies successfully.');"

      - name: Pull Vercel settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CATALOG_PROJECT_ID }}
        run: npx vercel pull --yes --environment="$TARGET_ENVIRONMENT" --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifacts
        if: github.event_name == 'push' || env.TARGET_ENVIRONMENT == 'production'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CATALOG_PROJECT_ID }}
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Build Vercel preview artifacts
        if: github.event_name != 'push' && env.TARGET_ENVIRONMENT == 'preview'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CATALOG_PROJECT_ID }}
        run: npx vercel build --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel production
        if: github.event_name == 'push' || env.TARGET_ENVIRONMENT == 'production'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CATALOG_PROJECT_ID }}
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Deploy Vercel preview
        if: github.event_name != 'push' && env.TARGET_ENVIRONMENT == 'preview'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CATALOG_PROJECT_ID }}
        run: npx vercel deploy --prebuilt --token="$VERCEL_TOKEN"

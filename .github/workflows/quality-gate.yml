name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-scopes:
    name: Detect commit scopes
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.scopes.outputs.admin }}
      catalog: ${{ steps.scopes.outputs.catalog }}
    steps:
      - name: Detect admin/catalog scopes in commit messages
        id: scopes
        uses: actions/github-script@v7
        with:
          script: |
            let messages = [];
            let changedFiles = [];
            if (context.eventName === 'pull_request') {
              const pullRequest = { owner: context.repo.owner, repo: context.repo.repo, pull_number: context.payload.pull_request.number };
              const [commits, files] = await Promise.all([
                github.paginate(github.rest.pulls.listCommits, pullRequest),
                github.paginate(github.rest.pulls.listFiles, pullRequest)
              ]);
              messages = commits.map(commit => commit.commit.message.split('\n')[0]);
              changedFiles = files.map(file => file.filename);
            } else {
              messages = (context.payload.commits || []).map(commit => commit.message.split('\n')[0]);
              if (context.payload.head_commit?.message) {
                messages.push(context.payload.head_commit.message.split('\n')[0]);
              }
              changedFiles = (context.payload.commits || []).flatMap(commit => [
                ...(commit.added || []), ...(commit.modified || []), ...(commit.removed || [])
              ]);
            }

            const combined = messages.join('\n');
            const paths = [...new Set(changedFiles)];
            const adminByScope = /\(admin\)/i.test(combined);
            const catalogByScope = /\(catalog\)/i.test(combined);
            const adminByPath = paths.some(path => path.startsWith('apps/admin/'));
            const catalogByPath = paths.some(path =>
              path.startsWith('apps/catalog/') ||
              path.startsWith('catalog/') ||
              path.startsWith('api/') ||
              path.startsWith('libs/shared/')
            );
            const admin = adminByScope || adminByPath;
            const catalog = catalogByScope || catalogByPath;
            core.setOutput('admin', String(admin));
            core.setOutput('catalog', String(catalog));
            core.info('Detected commit messages:\n' + messages.join('\n'));
            core.info('Detected changed files:\n' + paths.join('\n'));
            core.info(`admin scope: ${admin} (scope: ${adminByScope}, paths: ${adminByPath}); catalog scope: ${catalog} (scope: ${catalogByScope}, paths: ${catalogByPath})`);

  admin:
    name: Admin build and tests
    needs: detect-scopes
    if: needs.detect-scopes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from committed lockfile
        run: npm ci

      - name: Build admin for production
        run: npx ng build admin --configuration production

      - name: Test admin
        run: npx ng test admin --watch=false

  catalog:
    name: Public catalog build and tests
    needs: detect-scopes
    if: needs.detect-scopes.outputs.catalog == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from committed lockfile
        run: npm ci

      - name: Test legacy product image migration resolver
        run: npm run test:migrate:product-images

      - name: Test Cloudflare R2 storage and migration verifier
        run: |
          node --test scripts/lib/r2-storage.test.mjs
          node --check scripts/verify-r2-image-migration.mjs

      - name: Build catalog with static prerendering
        run: npx ng build catalog --configuration production

      - name: Verify prerendered catalog HTML for search engines
        run: |
          CATALOG_HTML="$(find dist/catalog -type f -name index.html -exec grep -li 'Elige tu caja' {} + | head -n 1)"
          if [ -z "$CATALOG_HTML" ]; then
            echo "::error::No prerendered catalog page containing the expected box-selection heading was found."
            find dist/catalog -type f -name index.html -print
            exit 1
          fi
          grep -qi 'rel="canonical"' "$CATALOG_HTML"
          echo "Verified canonical metadata and box-selection heading in $CATALOG_HTML"

      - name: Test catalog
        run: npx ng test catalog --watch=false

      - name: Type-check public and image APIs
        run: npx tsc --ignoreConfig --noEmit --strict --target ES2022 --moduleResolution bundler --module ES2022 --esModuleInterop --skipLibCheck --types node api/catalog.ts api/catalog-data.ts api/orders.ts api/order-document.ts api/order-short.ts api/admin-order-document.ts api/customer-lookup.ts api/public-seo.ts api/cookie-page.ts api/sitemap.ts api/image-upload.ts api/image-reference.ts api/image-cleanup.ts

      - name: Smoke-test public API imports with native Node ESM
        run: |
          rm -rf /tmp/starkies-catalog-esm
          npx tsc --ignoreConfig --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --skipLibCheck --types node --rootDir . --outDir /tmp/starkies-catalog-esm api/catalog-data.ts api/orders.ts api/public-seo.ts api/cookie-page.ts api/sitemap.ts
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/starkies-catalog-esm/node_modules
          node --input-type=module -e "await import('/tmp/starkies-catalog-esm/api/catalog-data.js'); const orders = await import('/tmp/starkies-catalog-esm/api/orders.js'); const cookie = await import('/tmp/starkies-catalog-esm/api/cookie-page.js'); const sitemap = await import('/tmp/starkies-catalog-esm/api/sitemap.js'); if (typeof orders.default !== 'function' || typeof cookie.default !== 'function' || typeof sitemap.default !== 'function') process.exit(1); console.log('Native Node ESM resolved catalog, order, cookie-page and sitemap API dependencies successfully.');"

  delete-merged-branch:
    name: Delete source branch after merge
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged source branch if it still exists
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`
              });
              core.info(`Deleted merged branch: ${branch}`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Source branch already deleted: ${branch}`);
              } else {
                throw error;
              }
            }

name: Admin CI

on:
  pull_request:
    paths:
      - "apps/admin/**"
      - "libs/shared/**"
      - "angular.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/admin-ci.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "apps/admin/**"
      - "libs/shared/**"
      - "angular.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/admin-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-admin:
    name: Build Angular admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build admin
        run: npx ng build admin --configuration production

name: Deploy Admin to Vercel

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - preview
          - production
        default: production

permissions:
  contents: read

concurrency:
  group: vercel-admin-${{ inputs.target_environment }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate Admin, then deploy
    runs-on: ubuntu-latest
    steps:
      - name: Guard deployment ref
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [ "$SELECTED_REF" != "refs/heads/main" ]; then
            echo "::error::Deployments can only run manually from main."
            exit 1
          fi

      - name: Check Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_ADMIN_PROJECT_ID."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from committed lockfile
        run: npm ci

      - name: Build admin for production
        run: npx ng build admin --configuration production

      - name: Test admin
        run: npx ng test admin --watch=false

      - name: Pull Vercel settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: npx vercel pull --yes --environment="$TARGET_ENVIRONMENT" --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifacts
        if: inputs.target_environment == 'production'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
        run: npx vercel build --local-config=vercel.admin.json --prod --token="$VERCEL_TOKEN"

      - name: Build Vercel preview artifacts
        if: inputs.target_environment == 'preview'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
        run: npx vercel build --local-config=vercel.admin.json --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel production
        if: inputs.target_environment == 'production'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
        run: npx vercel deploy --local-config=vercel.admin.json --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Deploy Vercel preview
        if: inputs.target_environment == 'preview'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
        run: npx vercel deploy --local-config=vercel.admin.json --prebuilt --token="$VERCEL_TOKEN"

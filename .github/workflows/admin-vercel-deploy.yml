name: Deploy Admin to Vercel

on:
  push:
    branches:
      - main
    paths:
      - "apps/admin/**"
      - "libs/shared/**"
      - "angular.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/admin-vercel-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-admin-production
  cancel-in-progress: true

jobs:
  deploy-admin:
    name: Build and deploy Admin
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check Vercel secrets
        id: config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped. Configure VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_ADMIN_PROJECT_ID in GitHub Actions secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pull Vercel project settings
        if: steps.config.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifacts
        if: steps.config.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifacts
        if: steps.config.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
